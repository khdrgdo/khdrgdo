<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Khider Mamon — Software Developer</title>
  <desc id="desc">A minimal dark navy banner with blue and cyan geometric accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.58" stop-color="#111C35"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#2563EB" stop-opacity=".28"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1010" cy="160" r="250" fill="url(#glow)"/>
  <circle cx="1010" cy="160" r="118" fill="none" stroke="url(#accent)" stroke-opacity=".5" stroke-width="1.5"/>
  <circle cx="1010" cy="160" r="82" fill="none" stroke="#CBD5E1" stroke-opacity=".16" stroke-width="1"/>
  <path d="M895 160h230M1010 45v230" stroke="#CBD5E1" stroke-opacity=".13" stroke-width="1"/>
  <path d="M930 220l80-120 80 120" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  <circle cx="1010" cy="160" r="5" fill="#38BDF8"/>
  <rect x="72" y="70" width="54" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="145" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-1.2">KHIDER MAMON</text>
  <text x="74" y="190" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="500">SOFTWARE DEVELOPER</text>
  <text x="74" y="232" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Building useful web and desktop applications.</text>
  <text x="74" y="270" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2">TYPESCRIPT  ·  PYTHON  ·  PRODUCT ENGINEERING</text>
